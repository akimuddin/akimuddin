
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="270"
     viewBox="0 0 900 270">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#102F4A"/>
      <stop offset="100%" stop-color="#005D73"/>
    </linearGradient>

    <linearGradient id="accent">
      <stop offset="0%" stop-color="#00C2D1"/>
      <stop offset="100%" stop-color="#62E6F2"/>
    </linearGradient>

    <clipPath id="circle">
      <circle cx="145" cy="130" r="88"/>
    </clipPath>
  </defs>

  <rect width="900" height="270" rx="20" fill="url(#bg)"/>

  <circle cx="145" cy="130" r="99"
          fill="none" stroke="#00C2D1"
          stroke-width="3"/>

  <image x="57" y="42"
         width="176" height="176"
         xlink:href="akim-profile.jfif"
         clip-path="url(#circle)"
         preserveAspectRatio="xMidYMid slice"/>

  <circle cx="145" cy="130" r="88"
          fill="none" stroke="#62E6F2"
          stroke-width="2"/>

  <text x="285" y="85"
        font-family="Arial,sans-serif"
        font-size="35" font-weight="bold"
        fill="#FFFFFF">
    MD AKIM UDDIN
  </text>

  <rect x="285" y="105" width="390"
        height="3" rx="2" fill="url(#accent)"/>

  <text x="285" y="145"
        font-family="Arial,sans-serif"
        font-size="19" fill="#62E6F2">
    WordPress &amp; WooCommerce Expert
  </text>

  <text x="285" y="180"
        font-family="Arial,sans-serif"
        font-size="15" fill="#FFFFFF">
    Web Designer | Web Developer
  </text>

  <text x="285" y="210"
        font-family="Arial,sans-serif"
        font-size="13" fill="#B9DCE8">
    Building Modern Digital Experiences
  </text>

  <circle cx="820" cy="45" r="5" fill="#00C2D1"/>
  <circle cx="850" cy="75" r="3" fill="#62E6F2"/>
  <circle cx="790" cy="105" r="4" fill="#00C2D1"/>

  <path d="M680 240 Q770 170 900 225"
        fill="none" stroke="#00C2D1"
        stroke-width="2" opacity=".6"/>

</svg>

